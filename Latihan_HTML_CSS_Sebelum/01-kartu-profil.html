<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>01 - Kartu Profil - Sebelum</title>
</head>
<body>

<style>
    /* CSS reset dasar */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* Atur body agar konten berada di tengah layar */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f0f0f0; /* Warna abu-abu terang */
        font-family: Arial, sans-serif;
    }

    /* Gaya untuk kartu profil */
    .profile-card {
        background-color: #ffffff; /* Background putih */
        width: 300px; /* Lebar sekitar 300px */
        padding: 20px; /* Padding */
        border-radius: 15px; /* Border-radius */
        text-align: center; /* Text-align center */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Box-shadow halus */
    }

    /* Gaya untuk gambar profil */
    .profile-card img {
        width: 100px; /* Lebar gambar */
        height: 100px; /* Tinggi gambar */
        object-fit: cover; /* Object-fit cover */
        border-radius: 50%; /* Lingkaran sempurna */
        margin-bottom: 15px; /* Margin bawah untuk jarak dengan teks */
    }

    /* Gaya untuk link "Hubungi Saya" */
    .profile-card a {
        text-decoration: none; /* Hilangkan garis bawah pada link */
        background-color: #007BFF; /* Warna background biru */
        color: #ffffff; /* Warna teks putih */
        padding: 10px 20px; /* Padding */
        border-radius: 5px; /* Border-radius */
        display: inline-block; /* Ubah display menjadi inline-block */
        transition: background-color 0.3s ease; /* Transisi untuk efek hover */
    }

    /* Efek hover pada link "Hubungi Saya" */
    .profile-card a:hover {
        background-color: #0056b3; /* Warna sedikit berubah saat hover */
    }
</style>
    
    <!-- 
    INSTRUKSI PENGERJAAN (TO-DO LIST):
    1. Tambahkan CSS reset dasar (margin: 0, padding: 0, box-sizing: border-box).
    2. Atur body agar konten berada di tengah layar (gunakan Flexbox, min-height: 100vh, background warna abu-abu terang).
    3. Bungkus elemen di bawah ke dalam class ".profile-card".
    4. Beri ".profile-card" background putih, lebar sekitar 300px, padding, border-radius (misal 15px), text-align center, dan box-shadow halus.
    5. Atur gambar (img) agar lebarnya misal 100px, height 100px, object-fit cover, dan border-radius 50% (lingkaran sempurna).
    6. Hilangkan garis bawah pada link <a> (text-decoration: none), beri warna background, padding, border-radius, dan ubah display menjadi inline-block.
    7. Beri efek hover pada link <a> agar warnanya sedikit berubah saat kursor diarahkan.
    -->
    <div class="profile-card">
        <img src="https://ui-avatars.com/api/?name=Hidayat&size=150" alt="Foto Hidayat">
        <h2>Hidayat</h2>
        <p>Web Developer</p>
        <a href="#">Hubungi Saya</a>
    </div>
</body>
</html>
