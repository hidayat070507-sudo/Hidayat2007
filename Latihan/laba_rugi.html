<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Laporan Laba Rugi - PT Prima Akuntindo</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="table-container">
        <div class="table-header-text">
            <h3>PT PRIMA AKUNTINDO</h3>
            <h4>LAPORAN LABA RUGI</h4>
            <p>Per 31 Oktober 2026</p>
        </div>
        
        <table class="financial-table">
            <thead>
                <tr>
                    <th>Kode</th>
                    <th>Keterangan Akun</th>
                    <th class="text-right">Nominal (Rp)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>4101</td>
                    <td>Pendapatan Jasa</td>
                    <td class="text-right">120.000.000</td>
                </tr>
                <tr>
                    <td>5101</td>
                    <td>Beban Gaji Karyawan</td>
                    <td class="text-right">30.000.000</td>
                </tr>
                <tr>
                    <td>5102</td>
                    <td>Beban Sewa Gedung</td>
                    <td class="text-right">10.000.000</td>
                </tr>
                <tr>
                    <td>5103</td>
                    <td>Beban Perlengkapan</td>
                    <td class="text-right">2.500.000</td>
                </tr>
                <tr>
                    <td colspan="2" class="font-bold">TOTAL LABA BERSIH</td>
                    <td class="text-right font-bold">77.500.000</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
