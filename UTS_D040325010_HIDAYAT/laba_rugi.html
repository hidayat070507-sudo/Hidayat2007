<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Laporan Laba Rugi - PT Prima Akuntindo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f610;
            color: #212529;
            min-height: 100vh;
            padding: 30px;
        }

        /* Kotak laporan */
        .container {
            width: 100%;
            max-width: 700px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #607d8b;
            border-radius: 5px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        /* Judul laporan */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 16px;
            margin-bottom: 3px;
        }

        .header p {
            font-size: 14px;
            margin-top: 3px;
        }

        /* Tabel laporan */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #607d8b;
            padding: 8px 10px;
            font-size: 14px;
        }

        th {
            background-color: #495057;
            color: white;
            text-align: center;
        }

        /* Warna baris tabel */
        tbody tr:nth-child(even) {
            background-color: #f1f3f5;
        }

        tbody tr:nth-child(odd) {
            background-color: white;
        }

        /* Kolom nominal rata kanan */
        .nominal {
            text-align: right;
            white-space: nowrap;
        }

        /* Total laba bersih */
        .total td {
            background-color: #d9e2ec;
            font-weight: bold;
            border-top: 2px solid #495057;
        }

        .total-label {
            text-align: right;
        }

        /* Tombol cetak */
        .actions {
            margin-top: 20px;
            text-align: right;
        }

        .btn-print {
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-print:hover {
            background-color: #084298;
        }

        /* Tampilan HP */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                margin: 20px auto;
                padding: 12px;
                overflow-x: auto;
            }

            th,
            td {
                padding: 7px;
                font-size: 12px;
            }
        }

        /* Pengaturan saat dicetak */
        @media print {
            body {
                background-color: white;
                padding: 0;
            }

            .container {
                margin: 0 auto;
                box-shadow: none;
            }

            .actions {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>PT PRIMA AKUNTINDO</h2>
            <h2>LAPORAN LABA RUGI</h2>
            <p>Per 31 Oktober 2026</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Kode</th>
                    <th>Keterangan Akun</th>
                    <th>Nominal (Rp)</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>4101</td>
                    <td>Pendapatan Jasa</td>
                    <td class="nominal">120.000.000</td>
                </tr>

                <tr>
                    <td>5101</td>
                    <td>Beban Gaji Karyawan</td>
                    <td class="nominal">30.000.000</td>
                </tr>

                <tr>
                    <td>5102</td>
                    <td>Beban Sewa Gedung</td>
                    <td class="nominal">10.000.000</td>
                </tr>

                <tr>
                    <td>5103</td>
                    <td>Beban Perlengkapan</td>
                    <td class="nominal">2.500.000</td>
                </tr>

                <tr class="total">
                    <td colspan="2" class="total-label">
                        TOTAL LABA BERSIH
                    </td>
                    <td class="nominal">77.500.000</td>
                </tr>
            </tbody>
        </table>

        <div class="actions">
            <button
                type="button"
                class="btn-print"
                onclick="window.print()"
            >
                Cetak Laporan
            </button>
        </div>

    </div>

</body>
</html>
