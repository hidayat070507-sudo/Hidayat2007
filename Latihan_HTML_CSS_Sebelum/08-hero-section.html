<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>08 - Hero Section - Sebelum</title>
</head>
<body>

<style>
    /* CSS reset dasar */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* Atur body agar konten berada di tengah layar */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f0f0f0; /* Warna abu-abu terang */
        font-family: Arial, sans-serif;
    }

    header {
        width: 100%;
        height: 100vh; /* Tinggi penuh layar */
        background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
        background-size: cover; /* Agar gambar menutupi seluruh area */
        background-position: center; /* Posisikan gambar di tengah */
        display: flex; /* Flexbox untuk konten di tengah */
        flex-direction: column; /* Susun konten secara vertikal */
        justify-content: center; /* Vertikal center */
        align-items: center; /* Horizontal center */
        color: #ffffff; /* Warna teks putih */
        text-align: center; /* Teks rata tengah */
    }

    .hero-content h1 {
        font-size: 48px; /* Ukuran font besar untuk judul */
        margin-bottom: 20px; /* Jarak bawah judul */
    }

    .hero-content p {
        font-size: 18px; /* Ukuran font untuk paragraf */
        margin-bottom: 30px; /* Jarak bawah paragraf */
    }

    .hero-content .btn {
        padding: 15px 30px; /* Padding tombol */
        background-color: #007BFF; /* Warna biru untuk tombol */
        color: #ffffff; /* Warna teks putih pada tombol */
        text-decoration: none; /* Hilangkan garis bawah pada link tombol */
        border-radius: 5px; /* Border-radius untuk tombol */
        transition: background-color 0.3s ease; /* Transisi untuk efek hover */
    }

    .hero-content .btn:hover {
        background-color: #0056b3; /* Warna biru lebih gelap saat hover */
    }       
</style>

    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Pada elemen <header>, atur height: 100vh agar memenuhi tinggi layar.
    2. Tambahkan background-image pada <header>. Agar gambar tidak belang, gunakan background-size: cover dan background-position: center.
    3. Agar teks mudah dibaca di atas gambar, tambahkan overlay linear-gradient pada property background-image (misal rgba hitam ke rgba hitam transparan).
    4. Gunakan Flexbox pada <header> (display: flex, flex-direction: column, justify-content: center, align-items: center) agar konten tepat di tengah.
    5. Ubah warna teks menjadi putih dan styling tombol (padding, background, border-radius).
    -->
    <header>
        <div class="hero-content">
            <h1>Bangun Masa Depan Digital Anda</h1>
            <p>Kami membantu startup dan perusahaan bertransformasi menjadi lebih modern dengan teknologi web terbaru.</p>
            <a href="#" class="btn">Mulai Proyek</a>
        </div>
    </header>
</body>
</html>
