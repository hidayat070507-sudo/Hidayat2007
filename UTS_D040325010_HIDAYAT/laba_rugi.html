<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Laporan Laba Rugi - PT Prima Akuntindo</title>
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>PT PRIMA AKUNTINDO</h2>
            <h2>LAPORAN LABA RUGI</h2>
            <p>Per 31 Oktober 2026</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Kode</th>
                    <th>Keterangan Akun</th>
                    <th>Nominal (Rp)</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>4101</td>
                    <td>Pendapatan Jasa</td>
                    <td class="nominal">120.000.000</td>
                </tr>

                <tr>
                    <td>5101</td>
                    <td>Beban Gaji Karyawan</td>
                    <td class="nominal">30.000.000</td>
                </tr>

                <tr>
                    <td>5102</td>
                    <td>Beban Sewa Gedung</td>
                    <td class="nominal">10.000.000</td>
                </tr>

                <tr>
                    <td>5103</td>
                    <td>Beban Perlengkapan</td>
                    <td class="nominal">2.500.000</td>
                </tr>

                <tr class="total">
                    <td colspan="2" class="total-label">
                        TOTAL LABA BERSIH
                    </td>
                    <td class="nominal">77.500.000</td>
                </tr>
            </tbody>
        </table>

        <div class="actions">
            <button
                type="button"
                class="btn-print"
                onclick="window.print()"
            >
                Cetak Laporan
            </button>
        </div>

    </div>

</body>
</html>
