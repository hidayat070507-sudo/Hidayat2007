<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>10 - Galeri Gambar - Sebelum</title>
</head>
<body>
<style>
    /* CSS reset dasar */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* Atur body agar konten berada di tengah layar */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f0f0f0; /* Warna abu-abu terang */
        font-family: Arial, sans-serif;
    }

    /* Gaya untuk galeri gambar */
    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
    }
</style>

    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Ubah class ".gallery" menjadi CSS Grid (grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))) dan beri gap.
    2. Pada elemen pembungkus gambar (.img-box), berikan properti aspect-ratio: 1/1 (agar selalu kotak), overflow: hidden, dan border-radius.
    3. Pada <img>, atur width: 100%, height: 100%, object-fit: cover agar gambar memenuhi kotak tanpa distorsi.
    4. Tambahkan filter: grayscale(100%) pada gambar agar berwarna hitam putih secara default, dan tambahkan efek transition.
    5. Saat di hover (img:hover), ubah filter menjadi grayscale(0) dan gunakan transform: scale(1.1) agar gambar membesar sedikit saat ditunjuk.
    -->
    <div class="gallery">
        <div class="img-box"><img src="https://images.unsplash.com/photo-1506744626753-1436bf3985a8?w=300" alt="Pemandangan 1"></div>
        <div class="img-box"><img src="https://images.unsplash.com/photo-1470770841072-f978bf4d5f89?w=300" alt="Pemandangan 2"></div>
        <div class="img-box"><img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=300" alt="Pemandangan 3"></div>
        <div class="img-box"><img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=300" alt="Pemandangan 4"></div>
        <div class="img-box"><img src="https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=300" alt="Pemandangan 5"></div>
        <div class="img-box"><img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=300" alt="Pemandangan 6"></div>
    </div>
</body>
</html>
