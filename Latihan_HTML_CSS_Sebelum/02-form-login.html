<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>02 - Form Login - Sebelum</title>
</head>
<body>
    
<style>
    /* CSS reset dasar */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* Atur body agar konten berada di tengah layar */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f0f0f0; /* Warna abu-abu terang */
        font-family: Arial, sans-serif;
    }

    /* Gaya untuk kontainer form login */
    .login-container {
        background-color: #ffffff; /* Background putih */
        padding: 30px; /* Padding */
        border-radius: 8px; /* Border-radius */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Box-shadow halus */
        width: 300px; /* Lebar sekitar 300px */
    }

    /* Gaya untuk label */
    .login-container label {
        display: block; /* Display block agar input berada di bawahnya */
        margin-bottom: 5px; /* Margin bawah untuk jarak dengan input */
    }

    /* Gaya untuk input text dan password */
    .login-container input[type="email"],
    .login-container input[type="password"] {
        width: 100%; /* Lebar penuh */
        padding: 10px; /* Padding */
        margin-bottom: 15px; /* Margin bawah untuk jarak dengan elemen berikutnya */
        border: 1px solid #ccc; /* Border abu-abu */
        border-radius: 5px; /* Border-radius */
    }

    /* Pseudo-class :focus pada input */
    .login-container input[type="email"]:focus,
    .login-container input[type="password"]:focus {
        border-color: #007BFF; /* Ubah warna border menjadi biru saat fokus */
        outline: none; /* Hilangkan outline default browser saat fokus */
    }

    /* Gaya untuk tombol submit */
    .login-container button[type="submit"] {
        width: 100%; /* Lebar penuh */
        background-color: #007BFF; /* Warna background biru */
        color: #ffffff; /* Warna teks putih */
        padding: 10px; /* Padding */
        border-radius: 5px; /* Border-radius */
        cursor: pointer; /* Ubah cursor menjadi pointer saat hover */
        border: none; /* Hilangkan border default */
    }

    /* Efek hover pada tombol submit */
    .login-container button[type="submit"]:hover {
        background-color: #0056b3; /* Ubah warna background saat hover */
    }
</style>

    <!-- 
    INSTRUKSI PENGERJAAN (TO-DO LIST):
    1. Atur body agar form berada di tengah layar (Flexbox, min-height 100vh).
    2. Berikan gaya pada kontainer ".login-container" (background putih, padding 30px, border-radius 8px, box-shadow).
    3. Atur label agar display-nya 'block' dan memiliki margin-bottom agar input ada di bawahnya.
    4. Atur input text dan password agar lebarnya 100% (width: 100%), padding 10px, margin-bottom 15px, border 1px solid #ccc, dan border-radius 5px.
    5. Tambahkan pseudo-class :focus pada input (ubah warna border menjadi biru dan outline: none saat diklik).
    6. Atur tombol submit (lebar 100%, background warna, warna teks putih, padding, border-radius, cursor: pointer, border: none).
    7. Tambahkan efek hover pada tombol submit.
    -->
    <div class="login-container">
        <h2>Masuk ke Akun</h2>
        <form>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan email">
            
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password">
            
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
