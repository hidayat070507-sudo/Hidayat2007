<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard Keuangan</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f610;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #212529;
            color: white;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h3 {
            margin-bottom: 25px;
            font-size: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 10px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .sidebar a:hover {
            background-color: #0d6efd;
        }

        .logout {
            margin-top: auto;
            text-align: center;
            background-color: #dc3545;
        }

        /* Konten utama */
        .main-content {
            flex: 1;
            padding: 35px;
        }

        .main-content h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #212529;
        }

        .welcome {
            margin-bottom: 25px;
            color: #555;
        }

        /* Kartu keuangan */
        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            padding: 25px 15px;
            background-color: white;
            border: 1px solid #8aa6c1;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .card h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #343a40;
        }

        .card p {
            font-size: 23px;
            font-weight: bold;
            color: #212529;
        }

        /* Tampilan HP */
        @media (max-width: 650px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
            }

            .logout {
                margin-top: 15px;
            }

            .main-content {
                padding: 20px;
            }

            .cards {
                flex-direction: column;
            }

            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <h3>Menu Utama</h3>

        <nav>
            <a href="dashboard.html">&gt; Dashboard</a>
            <a href="#jurnal">&gt; Jurnal</a>
            <a href="#buku-besar">&gt; Buku Besar</a>
            <a href="#laba-rugi">&gt; Laba Rugi</a>
            <a href="#neraca">&gt; Neraca</a>
        </nav>

        <a href="login.html" class="logout">Logout</a>
    </aside>

    <main class="main-content">
        <h1>DASHBOARD KEUANGAN</h1>
        <p class="welcome">
            Selamat datang, Manajer Keuangan!
        </p>

        <section class="cards">
            <div class="card">
                <h3>SALDO KAS</h3>
                <p>Rp 150.000.000</p>
            </div>

            <div class="card">
                <h3>PIUTANG</h3>
                <p>Rp 45.500.000</p>
            </div>
        </section>
    </main>
</body>
</html>
